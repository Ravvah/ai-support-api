name: CI

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      
      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Check code quality
        run: uv run ruff check .

      - name: Check types
        run: uv run pyright
        
      - name: Run tests
        run: uv run pytest -q